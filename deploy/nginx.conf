# Krishika AI — Nginx reverse proxy configuration
# For Ubuntu 24.04 on AWS EC2
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/krishika
#   sudo ln -s /etc/nginx/sites-available/krishika /etc/nginx/sites-enabled/krishika
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# BEFORE ENABLING SSL: Replace YOUR_DOMAIN_OR_EC2_PUBLIC_IP with your actual
# domain or EC2 public IP. If using a domain + Let's Encrypt, run certbot after
# the HTTP block is working:
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_EC2_PUBLIC_IP;

    # Redirect HTTP to HTTPS once SSL is configured
    # Uncomment this block after running certbot:
    # return 301 https://$host$request_uri;

    # ── Proxy to FastAPI ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Preserve client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (not currently used, included for future-proofing)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts — VGG19 inference can take a few seconds on t3.small
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Allow image uploads (match MAX_IMAGE_SIZE_MB)
        client_max_body_size 12M;
    }

    # ── Serve uploaded images directly via Nginx (faster than FastAPI StaticFiles) ──
    # NOTE (Security / Principle of Least Privilege on Ubuntu 24.04):
    # Do NOT chmod 755 /home/ubuntu (avoids exposing the home directory).
    # Instead, grant group access to Nginx (www-data) while keeping /home/ubuntu at 750:
    #   sudo usermod -aG ubuntu www-data
    #   sudo chmod g+x /home/ubuntu
    #   sudo chmod -R 750 /home/ubuntu/crop_disease_detection/uploads
    # Or alternatively, configure UPLOAD_DIR=/var/www/krishika/uploads in .env.
    location /uploads/ {
        alias /home/ubuntu/crop_disease_detection/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check endpoint (no auth needed for load-balancer probes) ──────
    location /api/health {
        proxy_pass http://127.0.0.1:8001/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # Suppress server version in responses
    server_tokens off;
}

